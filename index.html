<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Derrific</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="google" content="notranslate">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1F4FB;</text></svg>">
    <link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/354/radio_1f4fb.png">
</head>

<body>

    <div class="player-container">
        <h1>Radio Derrific</h1>

        <div class="current-info">
            <img id="current-image" src="" alt="" style="display: none;">
            <div class="current-text">
                <h2 id="current-station">Select a station</h2>
                <p id="now-playing"></p>
                <p id="current-city"></p>
                <p id="current-time"></p>
                <p id="current-genres"></p>
            </div>
        </div>

        <!-- Collapsible Filter Controls (inside player area) -->
        <div class="filter-toggles">
            <button id="toggle-favorites" class="filter-toggle-btn">&#9733; Favorites</button>
            <button id="toggle-guide" class="filter-toggle-btn">Radio Guide</button>
            <button id="toggle-genres" class="filter-toggle-btn">Show Genres &#9660;</button>
            <button id="toggle-timezones" class="filter-toggle-btn">Show Timezones &#9660;</button>
            <button id="clear-btn" class="clear-btn" style="display: none;">Clear Filters</button>
        </div>

        <!-- Genre Filter (collapsible) -->
        <div id="genre-filter" class="filter-panel" style="display: none;">
            <div id="genre-checkboxes" class="filter-list"></div>
        </div>

        <!-- Timezone Filter (collapsible) -->
        <div id="timezone-filter" class="filter-panel" style="display: none;">
            <div id="timezone-checkboxes" class="filter-list"></div>
        </div>
    </div>

    <!-- Sort Controls -->
    <div class="sort-container">
        <span class="sort-label">Sort by:</span>
        <button id="sort-alpha" class="sort-btn active">A-Z</button>
        <button id="sort-city" class="sort-btn">City A-Z</button>
        <button id="sort-genre" class="sort-btn">By Genre</button>
        <button id="sort-geo" class="sort-btn">West &#8594; East</button>
    </div>

    <div id="guide-view" class="guide-container" style="display: none;">
        <div id="guide-loading" class="guide-message">Select a station to see upcoming shows...</div>
        <div id="guide-content" class="guide-scroll-area">
            </div>
    </div>

    <div id="station-grid" class="station-grid">
    </div>
    
    <div class="footer-links">
        <p>Stream Tools:</p>
        <a href="https://fmstream.org" target="_blank">FMStream</a>
        <span>&#8226;</span>
        <a href="https://streamurl.link" target="_blank">StreamURL</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="radio-station-engine.js"></script>
    <script src="script.js"></script>
</body>

</html>
